; Dimensional Rift — rendering defaults tuned for a cel-shaded anime look.
; Everything here can also be set in Project Settings > Rendering.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_NYC_TimesSquare.L_NYC_TimesSquare
GlobalDefaultGameMode=/Game/Core/BP_DRGameMode.BP_DRGameMode_C

[/Script/Engine.RendererSettings]
; --- Anti-aliasing: TSR keeps thin ink lines stable. Forward+MSAA is the alternative (see guide).
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=200
r.TemporalAA.Upsampling=1
; --- Global illumination / reflections. Lumen stays on for soft bounce; the cel post-process quantizes it.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=0
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
; --- Kill the "photoreal" defaults that fight a toon image.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.EyeAdaptation.EditorViewportDefault=False
; --- Custom depth/stencil is required by the outline + per-character cel masks.
r.CustomDepth=3
r.CustomDepthTemporalAAJitter=False
; --- Tonemapper: film curve flattened so shading bands stay flat.
r.TonemapperFilm=1
r.Tonemapper.Sharpen=1.5
r.Tonemapper.Quality=5
; --- Post-process materials need scene textures (GBuffer) — keep deferred unless you switch to forward.
r.ForwardShading=0
r.SceneColorFormat=4
r.GBufferFormat=1
; --- Anime skies read better without atmospheric grit.
r.SkyAtmosphere=1
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
; --- Hair/cloth for anime characters.
r.HairStrands.Enable=1
r.SupportSkyAtmosphereAffectsHeightFog=True
r.GenerateMeshDistanceFields=True
r.DistanceFields.DefaultVoxelDensity=0.2

[/Script/Engine.CollisionProfile]
; Custom trace channel for web anchor points (assign to WebAnchor actors / tagged geometry).
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="WebAnchor")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Technique")

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-1470.000000
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_ThirdPerson",NewGameName="/Script/DimensionalRift")
